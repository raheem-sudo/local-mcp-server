[package]
name = "rust-mcp-sse-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
# Official Rust MCP SDK. "server" gives you the server-side traits/macros,
# "transport-sse-server" gives you the Server-Sent-Events HTTP transport
# (the one your JSON config with "type": "sse" expects).
rmcp = { version = "0.8", features = ["server", "transport-sse-server"] }
axum = "0.8"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"